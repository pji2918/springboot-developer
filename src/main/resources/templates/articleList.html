<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>블로그 글 목록</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" rel="stylesheet">
    <script crossorigin="anonymous"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="p-5 mb-5 text-center">
    <h1 class="mb-3">My Blog</h1>
    <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
</div>
<div class="container">
    <div class="row-6" th:each="article:${articles}" th:object="${article}">
        <div class="card">
            <div class="card-body">
                <a class="card-title" th:href="@{/articles/{id}(id = *{id})}" th:text="*{title}"></a>
                <div class="card-text" style="text-overflow:ellipsis; overflow: hidden; white-space: nowrap"
                     th:text="*{content}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
